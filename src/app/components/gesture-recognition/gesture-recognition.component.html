<video #video autoplay muted playsinline hidden></video>
<div class="gesture-control">
  <button type="button" (click)="startGestureControl()" aria-label="Start gesture control" title="Start gesture control">
    <span class="material-icons">photo_camera</span>
  </button>
  <span class="status-dot"></span>
  <p>{{ message }}</p>
</div>
